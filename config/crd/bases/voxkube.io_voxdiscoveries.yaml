---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: voxdiscoveries.voxkube.io
spec:
  group: voxkube.io
  names:
    kind: VoxDiscovery
    listKind: VoxDiscoveryList
    plural: voxdiscoveries
    shortNames:
    - vd
    singular: voxdiscovery
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.clusterRef
      name: Cluster
      type: string
    - jsonPath: .status.discoveredNodes
      name: Nodes
      type: integer
    - jsonPath: .status.endpointSliceCount
      name: Slices
      type: integer
    - jsonPath: .status.serviceName
      name: Service
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VoxDiscovery is the Schema for the voxdiscoveries API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VoxDiscoverySpec defines the desired state of a VoxDiscovery.
            properties:
              addressFact:
                default: networking.ip
                description: AddressFact is the Puppet fact path used to extract each
                  node's IP address.
                type: string
              clusterRef:
                description: ClusterRef is the name of the VoxCluster whose OpenVox
                  DB (PuppetDB) is queried.
                type: string
              endpointLabels:
                additionalProperties:
                  type: string
                description: |-
                  EndpointLabels adds per-target labels read from each node's OpenVox DB facts: target label name → fact
                  path, e.g. {"role": "trusted.extensions.pp_role", "os": "os.family"}. Values that are not valid Kubernetes
                  label values (e.g. containing spaces, longer than 63 characters) are skipped. Labels on the node's VoxNode
                  named monitoring.voxkube.io/<label> are added too and override EndpointLabels.
                  Names must match [a-zA-Z]([a-zA-Z0-9_]*[a-zA-Z0-9])? and must not be reserved Prometheus labels or also
                  appear in serviceMonitor.targetLabels.
                type: object
              ports:
                description: Ports lists the network ports exposed in the headless
                  Service and EndpointSlices.
                items:
                  description: DiscoveryPort defines a port exposed on the discovered
                    EndpointSlices and headless Service.
                  properties:
                    name:
                      description: Name of the port (e.g., "metrics", "blackbox").
                      type: string
                    port:
                      description: Port number (e.g., 9100 for node_exporter).
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    protocol:
                      default: TCP
                      description: Protocol is the network protocol (TCP, UDP, SCTP).
                      type: string
                  required:
                  - name
                  - port
                  type: object
                type: array
              selector:
                description: Selector filters which active nodes in PuppetDB are exported.
                properties:
                  classes:
                    description: Classes filters nodes whose last catalog contains
                      all of these classes (e.g. "profile::node_exporter").
                    items:
                      type: string
                    type: array
                  environment:
                    description: Environment filters nodes by Puppet environment (e.g.,
                      "production").
                    type: string
                  facts:
                    additionalProperties:
                      type: string
                    description: 'Facts filters nodes by exact fact key/value matches
                      (e.g., {"kernel": "Linux"}).'
                    type: object
                  pql:
                    description: |-
                      PQL is an additional Puppet Query Language filter expression ANDed into the inventory query,
                      e.g. `facts.os.family = "RedHat"`. Write only the expression that goes inside inventory[...] { }.
                    type: string
                type: object
              serviceMonitor:
                description: ServiceMonitor optionally creates a Prometheus ServiceMonitor
                  with hostname relabeling and mTLS.
                properties:
                  additionalLabels:
                    additionalProperties:
                      type: string
                    description: AdditionalLabels are extra labels added to the ServiceMonitor
                      metadata.
                    type: object
                  enabled:
                    default: false
                    description: Enabled creates a monitoring.coreos.com/v1 ServiceMonitor
                      targeting the headless Service.
                    type: boolean
                  interval:
                    default: 30s
                    description: Interval is the Prometheus scrape interval.
                    type: string
                  preserveNodeHostnameAsInstance:
                    default: true
                    description: PreserveNodeHostnameAsInstance adds relabelConfigs
                      so the VM's Puppet certname becomes the Prometheus instance
                      label.
                    type: boolean
                  scrapeTimeout:
                    default: 10s
                    description: ScrapeTimeout is the Prometheus scrape timeout.
                    type: string
                  targetLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      TargetLabels are static labels added to every scraped target, e.g. {"role": "web", "alerts": "true"}.
                      They are set on the headless Service and copied to the targets through the ServiceMonitor's targetLabels.
                      Keys must be Prometheus label names ([a-zA-Z_][a-zA-Z0-9_]*, not starting with "__") other than job,
                      instance, namespace, service, endpoint, pod and container. Values must be valid Kubernetes label values.
                    type: object
                  tls:
                    description: TLS configures HTTPS / mTLS scraping of VM exporters.
                    properties:
                      enabled:
                        default: false
                        description: Enabled turns on TLS/mTLS on the generated ServiceMonitor.
                        type: boolean
                      mode:
                        default: openvoxCA
                        description: |-
                          Mode selects "openvoxCA" (zero-touch mTLS using the OpenVox CA and auto-minted prometheus-scraper client cert)
                          or "secretRef" (custom TLS Secret).
                        enum:
                        - openvoxCA
                        - secretRef
                        type: string
                      secretName:
                        description: SecretName is the TLS Secret name when mode is
                          "secretRef".
                        type: string
                    type: object
                type: object
              syncInterval:
                default: 60s
                description: SyncInterval controls how frequently the operator queries
                  PuppetDB and updates EndpointSlices.
                type: string
            required:
            - clusterRef
            - ports
            type: object
          status:
            description: VoxDiscoveryStatus defines the observed state of a VoxDiscovery.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the VoxDiscovery state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discoveredNodes:
                description: DiscoveredNodes is the number of active VMs currently
                  exported into EndpointSlices.
                format: int32
                type: integer
              endpointSliceCount:
                description: EndpointSliceCount is the number of EndpointSlice objects
                  managed for this discovery.
                format: int32
                type: integer
              lastSyncTime:
                description: LastSyncTime is the timestamp of the last successful
                  PuppetDB sync.
                format: date-time
                type: string
              scraperSecretName:
                description: ScraperSecretName is the name of the mTLS client certificate
                  Secret minted when tls.mode is "openvoxCA".
                type: string
              serviceName:
                description: ServiceName is the name of the headless Service created
                  for this discovery.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
