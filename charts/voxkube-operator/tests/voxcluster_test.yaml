suite: VoxKube RBAC & Optional VoxCluster
templates:
  - templates/clusterrole.yaml
  - templates/voxcluster.yaml
tests:
  - it: should include RBAC rules for voxkube.io, EndpointSlices, OpenShift Routes, cert-manager, and ServiceMonitors
    template: templates/clusterrole.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - contains:
          path: rules
          content:
            apiGroups: ["voxkube.io"]
            resources: ["voxclusters", "voxnodes", "voxdiscoveries"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["discovery.k8s.io"]
            resources: ["endpointslices"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - contains:
          path: rules
          content:
            apiGroups: ["route.openshift.io"]
            resources: ["routes", "routes/custom-host"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - it: should not render a VoxCluster by default
    template: templates/voxcluster.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a VoxCluster when cluster.enabled is true
    template: templates/voxcluster.yaml
    set:
      cluster:
        enabled: true
        name: production
        code:
          git:
            remote: https://github.com/myorg/puppet-control-repo.git
        networking:
          externalHostname: puppet.apps.ocp.example.com
          openShiftRoute:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VoxCluster
      - equal:
          path: metadata.name
          value: production
      - equal:
          path: spec.code.git.remote
          value: https://github.com/myorg/puppet-control-repo.git
      - equal:
          path: spec.database.housekeeping.nodeTTL
          value: "7d"
      - equal:
          path: spec.networking.openShiftRoute.enabled
          value: true
