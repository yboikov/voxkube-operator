suite: VoxKube Operator Deployment & OpenShift SCC Compliance
templates:
  - templates/deployment.yaml
tests:
  - it: should render a Deployment with OpenShift restricted-v2 SCC compliance (no hardcoded runAsUser or fsGroup)
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-voxkube-operator
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - isNull:
          path: spec.template.spec.securityContext.runAsUser
      - isNull:
          path: spec.template.spec.securityContext.fsGroup

  - it: should enable leader election by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect

  - it: should configure namespace watch mode when scope.mode is namespace
    set:
      scope:
        mode: namespace
        watchNamespace: openvox
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespace=openvox

  - it: should pass the node metric label allowlist
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --node-metric-labels=alerts

  - it: should join several node metric labels
    set:
      metrics:
        nodeLabels: [alerts, team]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --node-metric-labels=alerts,team
