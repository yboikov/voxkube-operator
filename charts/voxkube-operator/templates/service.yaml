{{- if and .Values.metrics.enabled .Values.metrics.service.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voxkube-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voxkube-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port | default 8080 }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "voxkube-operator.selectorLabels" . | nindent 4 }}
{{- end }}
