{{- if .Values.cluster.enabled -}}
apiVersion: voxkube.io/v1alpha1
kind: VoxCluster
metadata:
  name: {{ .Values.cluster.name | default "production" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voxkube-operator.labels" . | nindent 4 }}
spec:
  code:
    mode: {{ .Values.cluster.code.mode | default "git" }}
    {{- if .Values.cluster.code.git.remote }}
    git:
      remote: {{ .Values.cluster.code.git.remote | quote }}
      authType: {{ .Values.cluster.code.git.authType | default "githubApp" }}
      pollInterval: {{ .Values.cluster.code.git.pollInterval | default "60s" }}
      synchronizedRollout: {{ .Values.cluster.code.git.synchronizedRollout }}
      generateTypes: {{ .Values.cluster.code.git.generateTypes }}
    {{- end }}
  server:
    image: {{ .Values.cluster.server.image | default "ghcr.io/yboikov/openvox-server:8.18.0" | quote }}
    replicas: {{ .Values.cluster.server.replicas | default 2 }}
    javaArgs: {{ .Values.cluster.server.javaArgs | default "-Xms1g -Xmx1g" | quote }}
  database:
    enabled: {{ .Values.cluster.database.enabled }}
    image: {{ .Values.cluster.database.image | default "ghcr.io/yboikov/openvox-db:8.18.0" | quote }}
    postgres:
      mode: {{ .Values.cluster.database.postgres.mode | default "builtin" }}
      {{- with .Values.cluster.database.postgres.host }}
      host: {{ . | quote }}
      {{- end }}
      {{- with .Values.cluster.database.postgres.databaseName }}
      databaseName: {{ . | quote }}
      {{- end }}
      {{- with .Values.cluster.database.postgres.credentialsSecretRef }}
      credentialsSecretRef: {{ . | quote }}
      {{- end }}
      {{- with .Values.cluster.database.postgres.sslMode }}
      sslMode: {{ . }}
      {{- end }}
    housekeeping:
      nodeTTL: {{ .Values.cluster.database.housekeeping.nodeTTL | default "7d" | quote }}
      nodePurgeTTL: {{ .Values.cluster.database.housekeeping.nodePurgeTTL | default "14d" | quote }}
      reportTTL: {{ .Values.cluster.database.housekeeping.reportTTL | default "14d" | quote }}
      gcInterval: {{ .Values.cluster.database.housekeeping.gcInterval | default 60 }}
  networking:
    {{- range $name, $ep := dict "server" .Values.cluster.networking.server "ca" .Values.cluster.networking.ca }}
    {{ $name }}:
      serviceType: {{ $ep.serviceType | default "ClusterIP" }}
      {{- with $ep.externalHostname }}
      externalHostname: {{ . | quote }}
      {{- end }}
      {{- with $ep.additionalDNSNames }}
      additionalDNSNames:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $ep.openShiftRoute $ep.openShiftRoute.enabled }}
      openShiftRoute:
        enabled: true
        {{- with $ep.openShiftRoute.host }}
        host: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  hieraSecrets:
    enabled: {{ .Values.cluster.hieraSecrets.enabled }}
    {{- with .Values.cluster.hieraSecrets.commonSecrets }}
    commonSecrets:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
