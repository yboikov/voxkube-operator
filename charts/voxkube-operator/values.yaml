# Default values for voxkube-operator.

replicaCount: 1

image:
  repository: ghcr.io/yboikov/voxkube-operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

leaderElect: true

scope:
  # cluster watches all namespaces; namespace watches a single namespace
  mode: cluster
  watchNamespace: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

metrics:
  enabled: true
  port: 8080
  service:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Optional single-command OpenVox cluster installation alongside the operator
cluster:
  enabled: false
  name: production
  code:
    mode: git
    git:
      remote: ""
      authType: githubApp
      pollInterval: 60s
      synchronizedRollout: true
      generateTypes: true
  server:
    # Pinned OpenVox Server version (immutable variant: 8.18.0-<git sha>). Keep in sync with the DB image.
    image: ghcr.io/yboikov/openvox-server:8.18.0
    replicas: 2
    javaArgs: "-Xms1g -Xmx1g"
  database:
    enabled: true
    image: ghcr.io/yboikov/openvox-db:8.18.0
    postgres:
      # builtin = ephemeral single-pod PostgreSQL for dev/demo only.
      # For production use mode: external with a CloudNativePG (or other) cluster, e.g.
      #   host: openvoxdb-rw.openvox.svc, credentialsSecretRef: openvoxdb-app
      mode: builtin
      host: ""
      databaseName: openvoxdb
      credentialsSecretRef: ""
      sslMode: require
    housekeeping:
      nodeTTL: 7d
      nodePurgeTTL: 14d
      reportTTL: 14d
      gcInterval: 60
  networking:
    # Compiler pool: what agents set as "server".
    server:
      externalHostname: ""
      additionalDNSNames: []
      serviceType: ClusterIP
      openShiftRoute:
        enabled: false
        host: ""
    # Certificate authority: what agents outside the cluster set as "ca_server".
    ca:
      externalHostname: ""
      additionalDNSNames: []
      serviceType: ClusterIP
      openShiftRoute:
        enabled: false
        host: ""
  hieraSecrets:
    enabled: true
    commonSecrets: []
