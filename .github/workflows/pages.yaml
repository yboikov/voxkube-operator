name: Docs site

# Builds the GitHub Pages site (site/ + README.md + an API explorer generated from the CRDs) from the latest
# release, so the docs always describe what `helm install` gives you. Pre-releases don't change the site.
# Runs when a release is published, or by hand (Actions → Docs site → Run workflow) to rebuild it.
# Needs Settings → Pages → Source: "GitHub Actions".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Find the release to publish
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then
            # Manual run: the latest release (GitHub's "latest" never points at a pre-release).
            tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing the docs of $tag"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install pyyaml
          python hack/gen-site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
