name: CI & Container Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint, Vet, Unit Tests & Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify generated deepcopy and CRDs are up to date
        run: |
          make generate manifests
          git diff --exit-code

      - name: Run go fmt & go vet
        run: |
          make fmt vet
          git diff --exit-code

      - name: Run Go unit and controller tests
        run: go test ./... -v -coverprofile=cover.out

      - name: Lint Helm chart
        run: |
          helm lint charts/voxkube-operator
          helm template voxkube charts/voxkube-operator --set cluster.enabled=true > /dev/null

  # Images are pushed only for releases (v* tags) and by the weekly rebuild of the latest release.
  # Pull requests and manual runs build without pushing; pushes to main only run lint and tests.
  #
  #   event                 voxkube-operator                    openvox-server / openvox-db
  #   release vX.Y.Z        X.Y.Z, X.Y, latest, <sha>           <openvox>, <openvox>-<sha>, <sha>
  #   pre-release vX.Y.Z-*  X.Y.Z-*, <sha>                      <openvox>-<sha>, <sha> (+ <openvox> if it doesn't exist yet)
  #   weekly schedule       (not rebuilt)                       <openvox>, <openvox>-<YYYYMMDD>  (latest release, base-image fixes)
  #
  # On releases and pre-releases the OpenVox images are not rebuilt when <openvox> exists and images/<image>/
  # is unchanged since the previous release: the existing image only gets the new tags.
  build-images:
    name: Build ${{ matrix.image }}
    needs: lint-and-test
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: voxkube-operator
            file: images/voxkube-operator/Containerfile
            version_arg: ""
          - image: openvox-server
            file: images/openvox-server/Containerfile
            version_arg: OPENVOX_SERVER_VERSION
          - image: openvox-db
            file: images/openvox-db/Containerfile
            version_arg: OPENVOXDB_VERSION
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      IS_PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
      IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
    steps:
      - name: Find the latest release (weekly rebuild)
        id: latest
        if: env.IS_SCHEDULE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest release: ${tag:-none}"

      - name: Decide whether this job runs
        id: gate
        run: |
          run=true
          if [ "$IS_SCHEDULE" = true ]; then
            # The weekly job only refreshes the OpenVox images of the latest release.
            if [ "${{ matrix.image }}" = voxkube-operator ] || [ -z "${{ steps.latest.outputs.tag }}" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest.outputs.tag || github.ref }}
          fetch-depth: 0  # tags, to compare against the previous release

      # Operator version: the tag on releases (v0.1.0 -> 0.1.0), otherwise <chart version>-dev.<sha>.
      - name: Determine versions
        id: ver
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ "$IS_TAG" = true ]; then
            op="${GITHUB_REF_NAME#v}"
          else
            op="$(grep -m1 -oP '^version:\s*\K\S+' charts/voxkube-operator/Chart.yaml)-dev.$(git rev-parse --short=7 HEAD)"
          fi
          ov=""
          if [ -n "${{ matrix.version_arg }}" ]; then
            ov=$(grep -m1 -oP "^ARG ${{ matrix.version_arg }}=\K\S+" "${{ matrix.file }}")
            test -n "$ov"
          fi
          {
            echo "operator=$op"
            echo "openvox=$ov"
            echo "sha=$(git rev-parse --short=7 HEAD)"
            echo "date=$(date -u +%Y%m%d)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "operator=$op openvox=${ov:-n/a}"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.gate.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release must not move <openvox>, unless that tag doesn't exist yet (a new pin); otherwise the
      # pre-release chart, which references <openvox>, couldn't be installed.
      - name: Check whether the OpenVox version tag exists
        id: exists
        if: steps.gate.outputs.run == 'true' && steps.ver.outputs.openvox != ''
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.openvox }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Releases reuse an OpenVox image instead of rebuilding it when its version tag exists and nothing under
      # images/<image>/ (its only build input) changed since the previous release. Base-image updates come from the
      # weekly rebuild. A pin bump (Renovate) changes the Containerfile and therefore rebuilds.
      - name: Decide whether the OpenVox image can be reused
        id: reuse
        if: steps.gate.outputs.run == 'true' && env.IS_TAG == 'true' && steps.ver.outputs.openvox != '' && steps.exists.outputs.exists == 'true'
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- "images/${{ matrix.image }}/"; then
            echo "images/${{ matrix.image }}/ unchanged since $prev: reusing ${{ steps.ver.outputs.openvox }}"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "images/${{ matrix.image }}/ changed since ${prev:-<no previous release>}: rebuilding"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute tags
        id: tags
        if: steps.gate.outputs.run == 'true'
        run: |
          img="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          op="${{ steps.ver.outputs.operator }}"; ov="${{ steps.ver.outputs.openvox }}"; sha="${{ steps.ver.outputs.sha }}"
          tags=()
          if [ "$IS_SCHEDULE" = true ]; then
            tags+=("$img:$ov" "$img:$ov-${{ steps.ver.outputs.date }}")
          elif [ "$IS_TAG" = true ]; then
            tags+=("$img:$sha")
            if [ -z "$ov" ]; then
              tags+=("$img:$op")
              if [ "$IS_PRERELEASE" = false ]; then
                tags+=("$img:${op%.*}" "$img:latest")
              fi
            else
              tags+=("$img:$ov-$sha")
              if [ "$IS_PRERELEASE" = false ] || [ "${{ steps.exists.outputs.exists }}" = false ]; then
                tags+=("$img:$ov")
              fi
            fi
          fi
          printf '%s\n' "${tags[@]}"
          {
            echo "list<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ ${#tags[@]} -gt 0 ] && echo "push=true" >> "$GITHUB_OUTPUT" || echo "push=false" >> "$GITHUB_OUTPUT"

      - name: Tag the existing ${{ matrix.image }} image
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          src="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.ver.outputs.openvox }}"
          args=()
          while read -r t; do
            [ -n "$t" ] && [ "$t" != "$src" ] && args+=(-t "$t")
          done <<< "${{ steps.tags.outputs.list }}"
          if [ ${#args[@]} -gt 0 ]; then
            docker buildx imagetools create "${args[@]}" "$src"
          fi

      - name: Build ${{ matrix.image }}
        if: steps.gate.outputs.run == 'true' && steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.openvox || steps.ver.outputs.operator }}
            org.opencontainers.image.revision=${{ steps.ver.outputs.sha }}
          build-args: |
            VERSION=${{ steps.ver.outputs.operator }}
            COMMIT=${{ steps.ver.outputs.sha }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Release: runs only for v* tags, after all images are pushed.
  #   1. the tag must equal Chart.yaml version and appVersion (v0.1.0 <-> 0.1.0); pre-releases (v0.3.0-rc.1)
  #      skip this and package the chart as the tag version instead
  #   2. the chart is pushed to oci://ghcr.io/<owner>/charts
  #   3. a GitHub Release is created with generated notes, the chart and the CRDs
  release:
    name: Release ${{ github.ref_name }}
    needs: build-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Check that the tag matches the chart
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 -oP '^version:\s*\K\S+' charts/voxkube-operator/Chart.yaml)
          app=$(grep -m1 -oP '^appVersion:\s*"?\K[^"\s]+' charts/voxkube-operator/Chart.yaml)
          echo "tag=$tag chart=$version appVersion=$app"
          if [ "$tag" != "$version" ] || [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag must match Chart.yaml version ($version) and appVersion ($app). Bump them in a PR before tagging."
            exit 1
          fi

      - name: Package and push the Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # Pre-release: the chart is packaged as the tag version and installs the matching operator image.
            helm package charts/voxkube-operator --destination dist --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          else
            helm package charts/voxkube-operator --destination dist
          fi
          helm push dist/voxkube-operator-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
          cat config/crd/bases/*.yaml > dist/voxkube-crds.yaml

      # Works both for tags pushed from the CLI (creates the release) and for releases created in the
      # GitHub UI, which create the tag themselves (attaches the assets to the existing release).
      - name: Create GitHub Release or attach assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (created in the UI); attaching assets"
            gh release upload "$GITHUB_REF_NAME" dist/voxkube-operator-*.tgz dist/voxkube-crds.yaml --clobber
          else
            pre=""
            [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
            gh release create "$GITHUB_REF_NAME" dist/voxkube-operator-*.tgz dist/voxkube-crds.yaml \
              --title "VoxKube $GITHUB_REF_NAME" --generate-notes --verify-tag $pre
          fi
